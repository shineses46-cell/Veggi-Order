name: Collect Garak market prices

on:
  workflow_dispatch:
  schedule:
    # 매일 한국시간 오전 6시 17분
    - cron: "17 21 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect market snapshot
        env:
          GARAK_API_ID: ${{ secrets.GARAK_API_ID }}
          GARAK_API_PASSWORD: ${{ secrets.GARAK_API_PASSWORD }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const items = { 'lettuce-green':'청상추', cucumber:'취청오이', carrot:'당근 수입', iceberg:'양상추(일반)', 'red-cabbage':'빨간 양배추', chili:'청양고추', perilla:'깻잎', 'green-onion':'대파(일반)' };
          const kst = (offset = 0) => new Intl.DateTimeFormat('sv-SE', { timeZone:'Asia/Seoul' }).format(new Date(Date.now() + offset * 86400000)).replaceAll('-', '');
          const eucKr = value => [...execFileSync('iconv', ['-f','UTF-8','-t','EUC-KR'], { input:value })].map(byte => '%' + byte.toString(16).padStart(2,'0').toUpperCase()).join('');
          const decode = value => String(value || '').replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1').replace(/&amp;/g, '&').trim();
          const xmlRows = xml => { const fields = ['PUM_NM','G_NAME','U_NAME','MI_P','MA_P','AV_P','FLUC','D_MARK_P','D_MARK_R','J_SAME_P','J_SAME_R']; const values = Object.fromEntries(fields.map(field => [field, [...xml.matchAll(new RegExp('<' + field + '[^>]*>([\s\S]*?)</' + field + '>', 'gi'))].map(match => decode(match[1]))])); const length = Math.max(0, ...fields.map(field => values[field].length)); return Array.from({length}, (_, index) => Object.fromEntries(fields.map(field => [field, values[field][index] || '']))).filter(row => row.G_NAME || row.AV_P); };
          const date = kst(), previous = kst(-1), weekBefore = kst(-7);
          const snapshot = { collectedAt:new Date().toISOString(), date, items:{} };
          for (const [key, name] of Object.entries(items)) {
            const query = new URLSearchParams({ id:process.env.GARAK_API_ID, passwd:process.env.GARAK_API_PASSWORD, dataid:'data36', pagesize:'50', pageidx:'1', 'portal.templet':'false', s_date:date, s_date_p:previous, s_date_p7:weekBefore, p_pos_gubun:'1', s_pum_nm:'2' });
            try {
              const response = await fetch('http://www.garak.co.kr/homepage/publicdata/dataJsonOpen.do?' + query + '&s_pummok=' + eucKr(name));
              const raw = await response.text();
              const rows = raw.trim().startsWith('{') ? (JSON.parse(raw).resultData || []) : xmlRows(raw);
              snapshot.items[key] = { name, rows, format:raw.trim().startsWith('{') ? 'json' : 'xml', ...(rows.length ? {} : { preview:raw.replace(/\s+/g,' ').slice(0,180) }) };
            } catch (error) { snapshot.items[key] = { name, rows:[], error:String(error.message || error) }; }
          }
          fs.mkdirSync('market', { recursive:true });
          fs.writeFileSync('market/latest.json', JSON.stringify(snapshot, null, 2));
          let history = []; try { history = JSON.parse(fs.readFileSync('market/history.json', 'utf8')); } catch {}
          history = (Array.isArray(history) ? history : []).filter(item => item.date !== date).concat(snapshot).slice(-45);
          fs.writeFileSync('market/history.json', JSON.stringify(history, null, 2));
          NODE
      - name: Save snapshots
        run: |
          git config user.name "veggi-order-bot"
          git config user.email "veggi-order-bot@users.noreply.github.com"
          git add market/latest.json market/history.json
          git diff --cached --quiet || git commit -m "Update market snapshot"
          git push
