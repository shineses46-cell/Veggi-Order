name: Collect Garak market prices

on:
  workflow_dispatch:
    inputs:
      end_offset:
        description: "조회 기준일 (0: 오늘, 1: 전날)"
        required: false
        default: "0"
        type: choice
        options:
          - "1"
          - "0"

permissions:
  contents: write

# Cloudflare Worker가 예약 실행을 호출할 때 수집·커밋이 겹치지 않도록
# 한 번에 하나만 실행한다.
concurrency:
  group: garak-market-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect market snapshot
        env:
          GARAK_API_ID: ${{ secrets.GARAK_API_ID }}
          GARAK_API_PASSWORD: ${{ secrets.GARAK_API_PASSWORD }}
        run: node scripts/collect-market-history.mjs --days 1 --end-offset ${{ github.event_name == 'schedule' && '0' || inputs.end_offset }}
      - name: Save snapshots
        run: |
          git config user.name "veggi-order-bot"
          git config user.email "veggi-order-bot@users.noreply.github.com"
          git add market/latest.json market/history.json market/availability-log.json
          git diff --cached --quiet || git commit -m "Update market snapshot"
          git push
