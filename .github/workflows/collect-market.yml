name: Collect Garak market prices


on:
  workflow_dispatch:
  schedule:
    # 매일 한국시간 오전 6시 17분
    - cron: "17 21 * * *"→ Runs at 21:17



permissions:
  contents: write


jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect market snapshot
        env:
          GARAK_API_ID: ${{ secrets.GARAK_API_ID }}
          GARAK_API_PASSWORD: ${{ secrets.GARAK_API_PASSWORD }}
        run: |
          node - <<'NODE'
          import fs from 'node:fs';
          const items = {
            'lettuce-green': '청상추', cucumber: '취청오이', carrot: '당근 수입',
            iceberg: '양상추(일반)', 'red-cabbage': '빨간 양배추', chili: '청양고추',
            perilla: '깻잎', 'green-onion': '대파(일반)'
          };
          const dateForKorea = (days = 0) => {
            const d = new Date(Date.now() + days * 86400000);
            const p = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(d);
            const v = Object.fromEntries(p.filter(x => x.type !== 'literal').map(x => [x.type, x.value]));
            return v.year + v.month + v.day;
          };
          const date = dateForKorea();
          const previous = dateForKorea(-1);
