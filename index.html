px}.market-unit-picker small b{color:#a12e2e;font-size:13px}.market-loading-card{padding:15px}.market-loading-card h3{margin:0 0 8px}.market-loading-card p{margin:0;color:#167a52;font-size:12px;font-weight:900}.market-loading-graph{height:126px;margin-top:10px;border:1px dashed #cbdcd2;border-radius:12px;background:linear-gradient(110deg,#f3f8f4 30%,#e6f0e9 48%,#f3f8f4 66%);background-size:200% 100%;animation:marketLoading 1.1s linear infinite}@keyframes marketLoading{to{background-position:-200% 0}}</style>
